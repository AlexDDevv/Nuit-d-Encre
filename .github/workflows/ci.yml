name: CI

on:
    push:
        branches: [master, test]
    pull_request:
        branches: [master, test]

# Un nouveau push sur la même branche annule le run précédent devenu obsolète.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

# La CI ne fait que lire le dépôt.
permissions:
    contents: read

jobs:
    frontend:
        # Nom figé : c'est le check exigé par le ruleset de protection de
        # master. Le renommer désactiverait silencieusement la règle.
        name: Frontend (lint, typecheck, test)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        defaults:
            run:
                working-directory: app/frontend
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              working-directory: .

            - name: Lint
              run: pnpm lint

            - name: Build
              run: pnpm build

            - name: Test
              run: pnpm test

    backend:
        # Nom figé : voir le job frontend.
        name: Backend (lint, typecheck, test)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        defaults:
            run:
                working-directory: app/backend
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              working-directory: .

            - name: Lint
              run: pnpm lint

            - name: Typecheck
              run: pnpm exec tsc --noEmit

            - name: Test
              run: pnpm test
